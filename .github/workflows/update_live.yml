name: 🕓 Mise à jour des matchs live

on:
  schedule:
    - cron: "*/30 * * * *"  # toutes les 30 minutes
  workflow_dispatch:

jobs:
  update-live:
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout du dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Installer Node.js et Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install playwright

      - name: 🚀 Lancer la mise à jour des matchs
        env:
          VPS_WEBHOOK: ${{ secrets.VPS_WEBHOOK }}
          GROUP_FILE: "groupes_json/championnats_groupe_1.json"
        run: node scripts/update_live.js
