name: Update Live Scores

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 min
  workflow_dispatch:

jobs:
  update-live:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Installer Playwright et dépendances
        run: |
          npm install playwright axios

      - name: 🚀 Mise à jour des scores live
        env:
          VPS_WEBHOOK: https://srv945262.hstgr.cloud/sofascore-ingest/update_live.php
        run: node scripts/update_live.js
