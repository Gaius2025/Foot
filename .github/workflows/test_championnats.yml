name: Test Fetch Championnats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"  # toutes les 6 heures, modifie si besoin

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps

      - name: Run fetch script
        env:
          SOFASCORE_COOKIE: ${{ secrets.SOFASCORE_COOKIE || '' }}
        run: |
          node scripts/fetch_championnats.js

